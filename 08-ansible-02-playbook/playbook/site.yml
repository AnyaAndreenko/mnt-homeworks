---
- name: Install Clickhouse
  hosts: clickhouse
  become: true

  tasks:
    - name: Download ClickHouse GPG key
      ansible.builtin.get_url:
        url: https://packages.clickhouse.com/repo-archive/CLICKHOUSE-KEY.GPG
        dest: /usr/share/keyrings/clickhouse-key.gpg
    - name: Add ClickHouse APT repository
      ansible.builtin.apt_repository:
        repo: deb [signed-by=/usr/share/keyrings/clickhouse-key.gpg] https://packages.clickhouse.com/deb/stable/ main/
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
    - name: Install ClickHouse packages
      ansible.builtin.apt:
        name:
          - clickhouse-client
          - clickhouse-server
        state: present
    - name: Ensure ClickHouse server is started and enabled
      ansible.builtin.systemd:
        name: clickhouse-server
        enabled: yes
        state: started

- name: Install vector
  hosts: vector
  handlers:
    - name: Start vector service
      become: true
      ansible.builtin.service:
        name: vector
        state: restarted
        
  tasks:
    - name: Get vector distrib
      ansible.builtin.get_url:
        url: "https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-1.x86_64.rpm"
        dest: "./vector-{{ vector_version }}.rpm"
        mode: "0644"
      notify: Start vector service

    - name: Install vector packages
      become: true
      ansible.builtin.dnf:
        name:
          - vector-{{ vector_version }}.rpm
        disable_gpg_check: true
    - name: Flush handlers to restart vector
      ansible.builtin.meta: flush_handlers

    - name: Configure Vector | ensure what directory exists
      ansible.builtin.file:
        path: "{{ vector_config_dir }}"
        state: directory
        mode: "0755"
    - name: Configure Vector | Template config
      ansible.builtin.template:
        src: "template/vector.yml.j2"
        dest: "{{ vector_config_dir }}/vector.yml"
        mode: "0644"
