---
- name: Install Clickhouse
  hosts: clickhouse
  become: true

  tasks:
    - name: Download ClickHouse GPG key
      ansible.builtin.get_url:
        url: https://packages.clickhouse.com/repo-archive/CLICKHOUSE-KEY.GPG
        dest: /usr/share/keyrings/clickhouse-key.gpg
    - name: Add ClickHouse APT repository
      ansible.builtin.apt_repository:
        repo: deb [signed-by=/usr/share/keyrings/clickhouse-key.gpg] https://packages.clickhouse.com/deb/stable/ main/
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
    - name: Install ClickHouse packages
      ansible.builtin.apt:
        name:
          - clickhouse-client
          - clickhouse-server
        state: present
    - name: Ensure ClickHouse server is started and enabled
      ansible.builtin.systemd:
        name: clickhouse-server
        enabled: yes
        state: started

- name: Install Vector
  hosts: vector
  become: true
  tasks:
    - name: Add APT key
      ansible.builtin.apt_key:
        url: https://repositories.timber.io/public/vector/gpg.key
        state: present

    - name: Add Vector repository
      ansible.builtin.apt_repository:
        repo: "deb https://repositories.timber.io/public/vector/deb/ubuntu focal main"
        state: present

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install Vector package
      ansible.builtin.apt:
        name: vector
        state: latest

    - name: Deploy vector config
      ansible.builtin.template:
        src: templates/vector.yml.j2
        dest: /etc/vector/vector.toml
        mode: '0644'
      notify:
        - Restart Vector

  handlers:
    - name: Restart Vector
      ansible.builtin.systemd:
        name: vector
        state: restarted
        enabled: true